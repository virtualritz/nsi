name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --features download_lib3delight,output,toolbelt,delight,jupyter"

  # Contract tests for renderer-independent crates (no 3Delight needed).
  # Test names are cited by the contract matrices in specs/.
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Test nsi-profile
        run: cargo test -p nsi-profile
      - name: Test nsi-stream (shm)
        run: cargo test -p nsi-stream --features shm
      - name: Build nsi-stream (vulkan)
        run: cargo build -p nsi-stream --features vulkan
      - name: Build nsi-stream (delight-bridge)
        run: cargo build -p nsi-stream --features delight-bridge
      # `nsi-intermediate` and `nsi-parse`: everything except the gates
      # that need a renderer. Those are named individually rather than
      # excluded, so a new renderer-free test file is a deliberate
      # addition here rather than something CI silently skips.
      - name: Test nsi-intermediate
        run: |
          cargo test -p nsi-intermediate --lib --features lua,gzip,zstd
          cargo test -p nsi-intermediate --test classifier
      - name: Test nsi-parse
        run: |
          cargo test -p nsi-parse --features lua,gzip,zstd \
            --lib --test roundtrip --test cross_crate --test lua \
            --test compressed --test allocation

  # Zero warnings, with every feature on. A feature-gated `match` arm
  # that only becomes unreachable under `--all-features` is exactly what
  # a default-feature clippy run misses.
  lints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Clippy
        run: |
          cargo clippy -p nsi-trait -p nsi-intermediate -p nsi-parse \
            --all-targets --all-features -- -D warnings
      - name: Format
        run: cargo fmt -p nsi-intermediate -p nsi-parse --check
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p nsi-intermediate -p nsi-parse --no-deps
          cargo doc -p nsi-intermediate -p nsi-parse --no-deps --all-features

  # Miri over the unsafe FFI marshalling and the display-driver lifecycle.
  #
  # The driver trampolines never call out through the C API, so Miri can
  # execute open -> write -> close in full and check every pointer it
  # touches, plus leaks. The three tests filtered out here (`tests::*`)
  # `dlopen` lib3delight, which Miri cannot do.
  #
  # Both aliasing models are run: Stacked Borrows is the default, Tree
  # Borrows is stricter about the raw-pointer patterns this crate uses.
  miri:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Miri
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup
      - name: Miri (stacked borrows)
        run: >
          cargo +nightly miri test -p nsi-ffi-wrap --features output --lib --
          pointer_marshalling ffi_round_trip argument::tests param_value
      - name: Miri (tree borrows)
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
        run: >
          cargo +nightly miri test -p nsi-ffi-wrap --features output --lib --
          pointer_marshalling ffi_round_trip argument::tests param_value
