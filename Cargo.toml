[package]
name = "nsi-record"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0 OR Zlib"
description = "Renderer-agnostic recorder for the Nodal Scene Interface – ɴsɪ."
repository = "https://github.com/virtualritz/nsi-mitsuba/"

[dependencies]
indexmap = "2"
# Path deps during development. `nsi-ffi-wrap` is here for its `Arg`
# type only -- it is the shared argument currency across backends, so
# consumers keep using the `nsi::point_slice!` family unchanged.
# Constructing an `Arg` loads no renderer; the dynamic loader only runs
# on `Context::new`.
nsi-ffi-wrap = { version = "0.9", path = "../../../nsi/crates/nsi-ffi-wrap" }
nsi-trait = { version = "0.3", path = "../../../nsi/crates/nsi-trait" }
