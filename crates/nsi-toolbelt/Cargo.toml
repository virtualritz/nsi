[package]
name = "nsi-toolbelt"
version = "0.9.0"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
# Let-chains, stable for edition 2024 since 1.88.
rust-version = "1.88"
keywords = ["graphics", "rendering", "3d", "ray-tracing", "scene-description"]
categories = ["graphics", "multimedia::images", "rendering::graphics-api"]
license = "MIT OR Apache-2.0 OR Zlib"
description = "Scene construction helpers for the Nodal Scene Interface – ɴsɪ."
readme = "README.md"
homepage = "https://www.3delight.com/"
documentation = "https://docs.rs/nsi-toolbelt/"
repository = "https://github.com/virtualritz/nsi/"

[dependencies]
nsi-ffi-wrap = { version = "0.9", path = "../nsi-ffi-wrap" }
petname = { version = "3", default-features = false, features = ["default-rng", "default-words"] }
rand = "0.10"
ultraviolet = { version = "0.10", features = ["f64"] }

[package.metadata.docs.rs]
all-features = true
