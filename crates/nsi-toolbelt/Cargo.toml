[package]
name = "nsi-toolbelt"
version = "0.10.2"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
# Let-chains, stable for edition 2024 since 1.88.
rust-version = "1.88"
keywords = ["graphics", "rendering", "3d", "ray-tracing", "scene-description"]
categories = ["graphics", "multimedia::images", "rendering::graphics-api"]
license = "MIT OR Apache-2.0 OR Zlib"
description = "Scene construction helpers for the Nodal Scene Interface – ɴsɪ."
readme = "README.md"
homepage = "https://www.3delight.com/"
documentation = "https://docs.rs/nsi-toolbelt/"
repository = "https://github.com/virtualritz/nsi/"
# The tests need a renderer and two unpublished path dependencies, so
# they cannot run from the published crate. Shipping them made
# `cargo test` fail for anyone who downloaded `nsi-ffi-wrap` 0.10.0.
include = ["src/**/*", "/Cargo.toml", "/README.md"]

[dependencies]
nsi-ffi-wrap = { version = "0.10", path = "../nsi-ffi-wrap" }
petname = { version = "3", default-features = false, features = ["default-rng", "default-words"] }
ultraviolet = { version = "0.10", features = ["f64"] }

[dev-dependencies]
# The render test drives real output callbacks.
nsi-ffi-wrap = { version = "0.10", path = "../nsi-ffi-wrap", features = ["output"] }
# `connection_rules` holds this crate's typed connection API against
# `nsi-intermediate`'s classifier, which is the same specification
# written twice. Path-only and unversioned on purpose: both crates are
# unpublished, and a dev-dependency with no version is stripped when
# this one is packaged.
nsi-intermediate = { path = "../nsi-intermediate" }
nsi-parse = { path = "../nsi-parse" }

[package.metadata.docs.rs]
all-features = true
