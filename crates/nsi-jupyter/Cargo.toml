[package]
name = "nsi-jupyter"
version = "0.11.0"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
# parking_lot 0.13, through nsi-ffi-wrap, needs 1.95.
rust-version = "1.95"
keywords = ["graphics", "rendering", "3d", "ray-tracing", "scene-description"]
categories = ["graphics", "multimedia::images", "rendering::graphics-api"]
license = "MIT OR Apache-2.0 OR Zlib"
description = "Jypyter notebooks support for ɴsɪ."
readme = "README.md"
homepage = "https://www.3delight.com/"
documentation = "https://docs.rs/nsi-jupyter/"
repository = "https://github.com/virtualritz/nsi/"

[dependencies]
base64 = "0.23"
bytemuck = "1"
evcxr_runtime = "1"
nsi-ffi-wrap = { version = "0.11", path = "../nsi-ffi-wrap", features = ["output"] }
png = "0.18"
rayon = "1"

[package.metadata.docs.rs]
all-features = true
