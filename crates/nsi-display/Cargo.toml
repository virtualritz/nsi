[package]
name = "nsi-display"
version = "0.1.0"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
# parking_lot 0.13, through nsi-ffi-wrap, needs 1.95.
rust-version = "1.95"
keywords = ["graphics", "rendering", "3d", "display-driver", "plugin"]
categories = ["graphics", "multimedia::images", "rendering::graphics-api"]
license = "MIT OR Apache-2.0 OR Zlib"
description = "Write ɴsɪ display drivers in safe Rust."
readme = "README.md"
documentation = "https://docs.rs/nsi-display/"
repository = "https://github.com/virtualritz/nsi/"

[dependencies]
ndspy-sys = "0.2"
nsi-ffi-wrap = { version = "0.11", path = "../nsi-ffi-wrap", features = ["output"] }

[dev-dependencies]
nsi = { version = "0.11", path = "../..", features = ["output"] }
png = "0.18"

[[example]]
name = "png_driver"
crate-type = ["cdylib"]

[package.metadata.docs.rs]
all-features = true
