[package]
name = "nsi-3delight"
version = "0.9.0"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
# Let-chains, stable for edition 2024 since 1.88.
rust-version = "1.88"
keywords = ["graphics", "rendering", "3d", "ray-tracing", "3delight"]
categories = ["graphics", "multimedia::images", "rendering::graphics-api"]
license = "MIT OR Apache-2.0 OR Zlib"
description = "Nodal Scene Interface (ɴsɪ) helpers for the 3Delight renderer."
readme = "README.md"
homepage = "https://www.3delight.com/"
documentation = "https://docs.rs/nsi-3delight/"
repository = "https://github.com/virtualritz/nsi/"

[dependencies]
nsi-ffi-wrap = { version = "0.10", path = "../nsi-ffi-wrap" }
nsi-toolbelt = { version = "0.9", path = "../nsi-toolbelt" }

[package.metadata.docs.rs]
all-features = true
