[package]
name = "nsi-intermediate"
version = "0.2.0"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
# parking_lot 0.13 needs 1.95.
rust-version = "1.95"
keywords = ["graphics", "rendering", "3d", "ray-tracing", "scene-description"]
categories = ["graphics", "multimedia::images", "rendering::graphics-api"]
license = "MIT OR Apache-2.0 OR Zlib"
description = "Renderer-agnostic intermediate representation for the Nodal Scene Interface – ɴsɪ."
readme = "README.md"
homepage = "https://www.3delight.com/"
documentation = "https://docs.rs/nsi-intermediate/"
repository = "https://github.com/virtualritz/nsi/"
# Whitelist rather than blacklist, as the workspace root does: an
# `exclude` list once shipped `.claude/` inside this very crate. Only
# `tests/classifier.rs` ships: the other three test files each contain
# at least one gate needing 3Delight and a licence server, so shipping
# them would make `cargo test` fail for anyone who installs the package
# without a renderer.
include = [
    "src/**/*",
    "tests/classifier.rs",
    "/Cargo.toml",
    "/README.md",
]

[features]
default = []
# Emit the scene as a Lua script, the third ɴsɪ front end alongside the
# C API and the stream. Pulls in nothing; gated because not every
# backend wants the surface.
lua = []
# `streamcompression` variants. ɴsɪ names `gzip` and `zstd`; each costs
# a dependency, so each is its own flag.
gzip = ["dep:flate2"]
zstd = ["dep:zstd"]
# Intern node handles with `ustr` instead of storing a `String` per
# occurrence. A handle is stored many times -- as the node key, on both
# ends of every edge, and in three edge indexes -- so interning trades
# a global table that is never freed for eight bytes a copy.
#
# **Additive, unlike the flag of the same name in `nsi-ffi-wrap`.**
# This one switches *storage*: every public signature still takes and
# returns `&str`, so two crates in one build that disagree about it
# still compile. `nsi-ffi-wrap`'s version switches the public `Handle`
# type, which is why enabling it there changes types for every other
# crate in the build.
ustr_handles = ["dep:ustr"]

[dependencies]
ahash = "0.8"
# Warns, once per name, about a deprecated attribute spelling.
log = "0.4"
indexmap = "2"
parking_lot = "0.13"
ustr = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
zstd = { version = "0.14", optional = true }
# `nsi-argument` is here for its `Arg` type only -- it is the shared
# argument currency across backends, so consumers keep using the
# `nsi::point_slice!` family unchanged. It depends on `nsi-trait` alone,
# so this crate builds without `nsi-sys`, its `bindgen` build script and
# a renderer: `nsi-ffi-wrap` re-exports the same `Arg`, so an `Arg` built
# here is the one `nsi_ffi_wrap::Context` takes.
#
# Path deps: this crate lives in the same workspace as what it depends
# on, which is the whole point of it living here.
nsi-argument = { version = "0.1", path = "../nsi-argument" }
nsi-trait = { version = "0.5", path = "../nsi-trait" }

[dev-dependencies]
# The round-trip tests render through 3Delight with `Context`.
nsi-ffi-wrap = { version = "0.11", path = "../nsi-ffi-wrap" }

[package.metadata.docs.rs]
all-features = true
