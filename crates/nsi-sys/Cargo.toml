[package]
name = "nsi-sys"
version = "0.9.0"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
build = "build.rs"
edition = "2024"
# Let-chains, stable for edition 2024 since 1.88.
rust-version = "1.88"
license = "Apache-2.0 OR BSD-3-Clause OR MIT OR Zlib"
description = "Auto-generated bindings for Illumination Research’s Nodal Scene Interface – ɴꜱɪ."
readme = "README.md"
documentation = "https://nsi.readthedocs.io/"
repository = "https://github.com/virtualritz/nsi/"

[badges]
maintenance = { status = "passively-maintained" }

[features]
default = []
# Omit the NSI callbacks from the generated wrapper. This
# is for writing a renderer exposting an NSI API.
omit_functions = []

[build-dependencies]
# Capped below 0.73: 0.73.2 (the only 0.73.x published) depends on `syn`
# ^3 directly while still depending on `prettyplease` 0.2, which is still
# on `syn` ^2 -- `bindgen::codegen`'s `prettyplease::unparse(&syn::parse_quote!(...))`
# then hands a syn-3 `File` to a function expecting syn-2's, which fails
# to compile (E0599, `ParseQuote` not implemented). `ndspy-sys` (a sibling
# dependency wherever this crate is built alongside 3Delight's display
# driver) pins the same `0.72` line already, so this also collapses two
# `bindgen`/`syn` copies in the tree to one. Lift the cap once a `0.73.x`
# release fixes the mismatch, or once `prettyplease` moves to `syn` 3.
bindgen = ">=0.72, <0.73"

[dependencies]
bitflags = "2"
