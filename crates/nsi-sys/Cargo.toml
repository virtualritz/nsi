[package]
name = "nsi-sys"
version = "0.10.0"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
build = "build.rs"
edition = "2024"
# Let-chains, stable for edition 2024 since 1.88.
rust-version = "1.88"
license = "Apache-2.0 OR BSD-3-Clause OR MIT OR Zlib"
description = "Auto-generated bindings for Illumination Research’s Nodal Scene Interface – ɴꜱɪ."
readme = "README.md"
documentation = "https://nsi.readthedocs.io/"
repository = "https://github.com/virtualritz/nsi/"

[badges]
maintenance = { status = "passively-maintained" }

[features]
default = []
# Omit the NSI callbacks from the generated wrapper. This
# is for writing a renderer exposting an NSI API.
omit_functions = []

[build-dependencies]
# 0.73.2 takes `syn` `>=2, <4` and `prettyplease` `>=0.2.7, <0.4`, and
# `prettyplease` 0.3 is on `syn` 3, so the 0.73.0 mismatch (a syn-3 `File`
# handed to a syn-2 `prettyplease::unparse`) no longer resolves. `ndspy-sys`
# 0.2.3 is still on the 0.72 line, so builds with 3Delight's display driver
# carry two `bindgen` copies until it moves.
bindgen = "0.73"

[dependencies]
bitflags = "2"
