[package]
name = "nsi-trait"
version = "0.4.0"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
# Let-chains, stable for edition 2024 since 1.88.
rust-version = "1.88"
keywords = ["graphics", "rendering", "3d", "ray-tracing", "scene-description"]
categories = ["graphics", "multimedia::images", "rendering::graphics-api"]
license = "MIT OR Apache-2.0 OR Zlib"
description = "Core traits and types for the Nodal Scene Interface – ɴsɪ."
readme = "README.md"
homepage = "https://www.3delight.com/"
documentation = "https://docs.rs/nsi-trait/"
repository = "https://github.com/virtualritz/nsi/"
# Whitelist rather than blacklist, as the other crates do: without it
# `cargo package` shipped a `.claude/audit` log that a hook had written
# into the crate directory.
include = [
    "src/**/*",
    "/Cargo.toml",
    "/README.md",
]

[dependencies]
bitflags = "2"
ustr = { version = "1", optional = true }

[features]
default = []
ustr = ["dep:ustr"]

[package.metadata.docs.rs]
all-features = true
