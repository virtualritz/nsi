[package]
name = "nsi-argument"
version = "0.1.1"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
# Let-chains, stable for edition 2024 since 1.88.
rust-version = "1.88"
keywords = ["graphics", "rendering", "3d", "ray-tracing", "scene-description"]
categories = ["graphics", "multimedia::images", "rendering::graphics-api"]
license = "MIT OR Apache-2.0 OR Zlib"
description = "Typed arguments for Nodal Scene Interface calls, without FFI – ɴsɪ."
readme = "README.md"
homepage = "https://www.3delight.com/"
documentation = "https://docs.rs/nsi-argument/"
repository = "https://github.com/virtualritz/nsi/"
# Whitelist rather than blacklist, as the other crates do.
include = [
    "src/**/*",
    "/Cargo.toml",
    "/README.md",
]

[dependencies]
enum_dispatch = "0.3"
nsi-trait = { version = "0.5.1", path = "../nsi-trait" }
ustr = "1"

[dev-dependencies]
log = "0.4"
# The doc examples hand their arguments to a real `Context`. A dev-only
# cycle: the library itself never depends on `nsi-ffi-wrap`. No version, so
# `cargo publish` drops it: nsi-ffi-wrap is published after this crate.
nsi-ffi-wrap = { path = "../nsi-ffi-wrap" }

[package.metadata.docs.rs]
all-features = true
